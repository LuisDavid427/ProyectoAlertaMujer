# Puerto de la aplicación
server.port=8080

# Configuración para que Spring Boot encuentre tu MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/db_alerta_mujer?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Esto hace que Spring Boot cree las tablas en la BD si no existen
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.org.springframework.web=DEBUG
spring.jpa.hibernate.ddl-auto=validate

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml