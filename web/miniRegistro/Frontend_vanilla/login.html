<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Alerta Mujer</title>
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/buttons.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <div class="container nav-container">
            <div class="logo">
                <a href="inicio.html" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px;">
                    <img src="imagenes/logo.png" alt="Alerta Mujer"> 
                    <span>Alerta Mujer</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container login-main">
        <div class="login-card card">
            <span class="badge" style="margin-bottom: 15px; display: inline-block;">Acceso Seguro</span>
            <h2>Bienvenid@</h2>
            <p class="subtitle" style="margin-bottom: 30px;">Ingresa tus datos para gestionar el sistema</p>
            
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" class="input-field" placeholder="ejemplo@correo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" class="input-field" placeholder="••••••••">
            </div>

            <button onclick="ejecutarLogin()" class="btn-primary" style="width: 100%; border: none; cursor: pointer; font-weight: 600; margin-top: 10px;">
                INICIAR SESIÓN
            </button>
            
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
