# Puerto de la aplicación
server.port=${SERVER_PORT:8080}

# Configuración de la base de datos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_alerta_mujer?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA y logs
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Archivos adjuntos
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:15MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:15MB}

# Firebase Admin SDK
firebase.config.path=${FIREBASE_CONFIG_PATH:classpath:alerta-mujer-d404e-firebase-adminsdk-fbsvc-fcfa4eaebb.json}

# Configuración de correo
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:alertamujer767@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
